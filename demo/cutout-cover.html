<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
function enterFullscreen() {
  document.documentElement.requestFullscreen();
}

function exitFullscreen() {
  document.documentElement.exitFullscreen();
}
</script>
<style>
body {
	padding: 0;
	margin: 0;
}
#contents {
  padding-right: env(safe-area-inset-right);
  padding-left: env(safe-area-inset-left);
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  background: gray;
}
#refreshbutton {
  position: fixed;
  top: 100px;
  left: 50px;
}
#result {
  position: fixed;
  top: 200px;
  left: 50px;
  background: white;
}
.stuck-to-the-top-of-the-viewport {
  position: fixed;
  top: env(safe-area-inset-top);
  right: env(safe-area-inset-right);
  left: 300px;
  font-size: 24px;
  background: red;
}
.stuck-to-the-bottom-of-the-viewport {
  position: fixed;
  bottom: env(safe-area-inset-bottom);
  right: env(safe-area-inset-right);
  font-size: 24px;
  background: red;
}
</style>
<script>
function refresh() {
  let element = document.getElementById("contents");
  let style = window.getComputedStyle(element);
  let result = document.getElementById("result");
  result.innerText = "safe-area-inset (" + style.getPropertyValue('padding-left') + ", " + style.getPropertyValue('padding-top') + ") - (" +
  style.getPropertyValue('padding-right') + ", " + style.getPropertyValue('padding-bottom') + ")";
}
</script>
</head>
<body>
<div id="contents">
<button onclick="enterFullscreen()">Fullscreen</button><br>
<button onclick="exitFullscreen()">Exit Fullscreen</button><br>
<button onclick="refresh()" id="refreshbutton">Show safe area insets variable</button><br>
<div id="result"></div>
<div class="stuck-to-the-top-of-the-viewport">top</div>
